<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>...</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070604;color:#cfcabb;font:16px/1.9 "Courier New",monospace}
main{width:min(600px,90vw);text-align:center}p{margin:0;min-height:30px}
#f{font:700 clamp(34px,10vw,64px) Cinzel,serif;color:#e0b855;letter-spacing:.08em;margin-top:36px;opacity:0;transition:opacity 2.5s;text-shadow:0 0 28px rgba(224,184,85,.45)}
#f.on{opacity:1}
</style></head><body><main>
<div id="t"></div><div id="f">Minh Siêu Bel</div>
</main>
<script>
// Sửa các dòng dưới đây thành lời của bạn.
const L=["Anh đã đi qua năm cánh cửa.","Không có cánh cửa nào là ngẫu nhiên.","Chỉ còn một điều em không muốn giấu nữa."];
const el=document.getElementById('t');let n=0;
function line(){if(n>=L.length){document.getElementById('f').classList.add('on');return}
const p=document.createElement('p');el.appendChild(p);const s=L[n++];let j=0;
(function k(){p.textContent=s.slice(0,++j);if(j<s.length)setTimeout(k,50);else setTimeout(line,1000)})()}
setTimeout(line,800);
</script></body></html>
