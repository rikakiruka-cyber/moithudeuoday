<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LSB // nhìn vào kênh xanh dương</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0b;color:#cfcabb;font:14px/1.7 "Courier New",monospace}
main{width:min(640px,92vw);padding:24px 0}canvas{width:100%;image-rendering:pixelated;border:1px solid #333;display:block}
.b{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button{background:none;border:1px solid #555;color:#cfcabb;font:inherit;padding:6px 12px;cursor:pointer}button:hover{border-color:#c9a24b;color:#fff}
input{width:100%;background:none;border:0;border-bottom:1px solid #777;color:#fff;font:inherit;padding:8px 0;outline:0}input:focus{border-color:#c9a24b}
#m{color:#c9a24b;min-height:24px;margin-top:8px}small{color:#777}
</style></head><body><main>
<p>Một bức ảnh nhiễu. Thông điệp nằm ở bit cuối cùng của một kênh màu.</p>
<canvas id="c" width="320" height="80"></canvas>
<div class="b"><button data-m="F">Gốc</button><button data-m="R">Đỏ</button><button data-m="G">Lục</button><button data-m="B">Lam</button><button data-m="L">Bit cuối của Lam</button></div>
<p><small>Địa chỉ cửa tiếp theo = từ ẩn (chữ thường) + 3301</small></p>
<input id="i" placeholder="nhập địa chỉ" autocomplete="off">
<div id="m"></div>
</main>
<script>
const W=320,H=80,c=document.getElementById('c'),x=c.getContext('2d');
const t=document.createElement('canvas');t.width=W;t.height=H;const u=t.getContext('2d');
u.font='bold 64px monospace';u.textAlign='center';u.textBaseline='middle';u.fillText('RUNE',W/2,H/2+4);
const q=u.getImageData(0,0,W,H).data,d=x.createImageData(W,H),p=d.data;
for(let i=0;i<W*H;i++){const o=i*4;p[o]=Math.random()*256|0;p[o+1]=Math.random()*256|0;p[o+2]=(Math.random()*128|0)*2+(q[o+3]>128?1:0);p[o+3]=255}
function show(m){const e=x.createImageData(W,H);for(let i=0;i<p.length;i+=4){let r=p[i],g=p[i+1],b=p[i+2];
if(m==='R')g=b=r;else if(m==='G')r=b=g;else if(m==='B')r=g=b;else if(m==='L')r=g=b=(b&1)*255;
e.data[i]=r;e.data[i+1]=g;e.data[i+2]=b;e.data[i+3]=255}x.putImageData(e,0,0)}
show('F');document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.m));
const i=document.getElementById('i'),m=document.getElementById('m');
i.addEventListener('keydown',e=>{if(e.key!=='Enter')return;
if(i.value.trim().toLowerCase()==='rune3301'){m.textContent='Đúng.';setTimeout(()=>location.href='../rune3301/',700)}else m.textContent='Sai.'});
</script></body></html>
